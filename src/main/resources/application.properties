server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch browser disabled for automated runs
vaadin.launch-browser=false

# Allowed packages for Vaadin Flow
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.example

# H2 Database configuration (Persistent local file for offline-first store)
spring.datasource.url=jdbc:h2:file:./data/laundrydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
